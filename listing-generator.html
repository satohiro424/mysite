<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="出品文">
<meta name="theme-color" content="#c8a96e">
<link rel="manifest" href="manifest.json">
<title>出品文ジェネレーター</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --accent: #c8a96e;
    --text: #e8e0d0;
    --dim: #7a7068;
    --green: #4a9e6e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', sans-serif; padding: 16px; min-height: 100vh; }
  h1 { font-size: 11px; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; text-align: center; padding: 20px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; }
  .lbl { font-size: 10px; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  select, input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 15px; padding: 10px 12px; outline: none; font-family: inherit; }
  select:focus, input:focus { border-color: var(--accent); }
  select option { background: #1a1a1a; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row .unit { font-size: 12px; color: var(--dim); white-space: nowrap; min-width: 40px; }
  .row input { flex: 1; }
  .row input.qty { flex: 0 0 72px; }
  .x { background: none; border: 1px solid #3a2a2a; border-radius: 4px; color: #6a4040; cursor: pointer; font-size: 15px; padding: 7px 10px; transition: all 0.15s; }
  .x:hover { color: #cc4040; border-color: #8a3030; }
  .add { width: 100%; background: none; border: 1px dashed var(--border); border-radius: 6px; color: var(--dim); cursor: pointer; font-size: 12px; padding: 10px; transition: all 0.15s; margin-top: 2px; font-family: inherit; }
  .add:hover { border-color: var(--accent); color: var(--accent); }
  .gen { width: 100%; background: var(--accent); border: none; border-radius: 8px; color: #0f0f0f; cursor: pointer; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; padding: 15px; text-transform: uppercase; transition: all 0.15s; margin-bottom: 10px; font-family: inherit; }
  .gen:hover { background: #dfc07e; }
  .out { display: none; }
  .out.on { display: block; }
  .out-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 8px; }
  .out-lbl { font-size: 9px; color: var(--dim); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
  .out-text { font-size: 13px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
  .copy { width: 100%; background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--dim); cursor: pointer; font-size: 11px; letter-spacing: 0.1em; padding: 9px; text-transform: uppercase; transition: all 0.15s; margin-top: 8px; font-family: inherit; }
  .copy:hover { border-color: var(--accent); color: var(--accent); }
  .copy.ok { border-color: var(--green); color: var(--green); }
</style>
</head>
<body>

<h1>Listing Generator</h1>

<div class="card">
  <div class="lbl">Country / Currency</div>
  <select id="country" onchange="updateUnit()">
    <option value="台湾|台湾ドル|NTD">Taiwan (NTD)</option>
    <option value="韓国|韓国ウォン|KRW">Korea (KRW)</option>
    <option value="香港|香港ドル|HKD">Hong Kong (HKD)</option>
    <option value="中国|人民元|CNY">China (CNY)</option>
    <option value="アメリカ|米ドル|USD">USA (USD)</option>
    <option value="タイ|タイバーツ|THB">Thailand (THB)</option>
    <option value="シンガポール|シンガポールドル|SGD">Singapore (SGD)</option>
    <option value="ベトナム|ベトナムドン|VND">Vietnam (VND)</option>
  </select>
</div>

<div class="card">
  <div class="lbl">Breakdown (denom × qty)</div>
  <div id="items"></div>
  <button class="add" onclick="addRow()">+ Add</button>
</div>

<button class="gen" onclick="generate()">Generate</button>

<div class="out" id="out">
  <div class="card">
    <div class="out-box">
      <div class="out-lbl">Title</div>
      <div class="out-text" id="o-title"></div>
      <button class="copy" onclick="cp('o-title',this)">Copy</button>
    </div>
    <div class="out-box">
      <div class="out-lbl">Description</div>
      <div class="out-text" id="o-desc"></div>
      <button class="copy" onclick="cp('o-desc',this)">Copy</button>
    </div>
  </div>
</div>

<script>
  function getInfo() {
    const [country, currency, unit] = document.getElementById('country').value.split('|');
    return { country, currency, unit };
  }

  function updateUnit() {
    const { unit } = getInfo();
    document.querySelectorAll('.unit').forEach(el => el.textContent = unit);
  }

  function addRow() {
    const { unit } = getInfo();
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `
      <input type="number" placeholder="Value" min="1" class="denom">
      <span class="unit">${unit}</span>
      <input type="number" placeholder="枚" min="1" class="qty">
      <button class="x" onclick="this.parentElement.remove()">×</button>
    `;
    document.getElementById('items').appendChild(div);
  }

  function generate() {
    const { country, currency, unit } = getInfo();
    
    const rows = document.querySelectorAll('#items .row');
    const items = [];
    rows.forEach(r => {
      const d = r.querySelector('.denom').value;
      const q = parseInt(r.querySelector('.qty').value) || 0;
      if (d && q > 0) items.push({ d, q });
    });
    if (!items.length) { alert('内訳を入力してください'); return; }
    const totalVal = items.reduce((s, i) => s + (parseInt(i.d) * i.q), 0);
    const title = `旧 ${currency} ${totalVal}${unit} コレクター`;
    const itemLines = items.map(i => `${i.d}${unit} ${i.q}枚`).join('\n');
    const desc = `旧${currency}のセットです。\n写真のものを発送いたします。\n即購入大歓迎です。\n\n${itemLines}\n\n#${country}\n#${currency}\n#アンティーク\n#外国コイン`;
    document.getElementById('o-title').textContent = title;
    document.getElementById('o-desc').textContent = desc;
    const out = document.getElementById('out');
    out.classList.add('on');
    out.scrollIntoView({ behavior: 'smooth' });
  }

  function cp(id, btn) {
    navigator.clipboard.writeText(document.getElementById(id).textContent).then(() => {
      btn.textContent = 'Copied ✓';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2000);
    });
  }

  addRow();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
